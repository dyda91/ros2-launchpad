name: ros2-launchpad

services:
  lab:
    build:
      context: .
      dockerfile: lab/image/Dockerfile
    image: ros2-launchpad-lab:dev
    container_name: ros2-launchpad-lab
    init: true
    network_mode: none
    user: "1000:1000"
    working_dir: /ros_ws
    environment:
      HOME: /home/ubuntu
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-42}"
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      GZ_PARTITION: "${GZ_PARTITION:-launchpad_dev}"
      GZ_IP: 127.0.0.1
    command: ["sleep", "infinity"]
    volumes:
      - ./tests:/tests:ro
      - ./content:/content:ro
    shm_size: "512m"
    mem_limit: "2g"
    cpus: 2.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tty: true
    stdin_open: true
    stop_grace_period: 20s
